<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <title>DotnetPilot: AI coding agents that understand your .NET solution</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120c2e"/>
      <stop offset="55%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#071a22"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#512bd4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#512bd4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0ea5b7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0ea5b7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <circle cx="260" cy="180" r="560" fill="url(#glowPurple)"/>
  <circle cx="1380" cy="820" r="520" fill="url(#glowCyan)"/>

  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <rect x="96" y="124" width="318" height="40" rx="20" fill="#512bd4" fill-opacity="0.22" stroke="#8b6cff" stroke-opacity="0.45"/>
    <text x="116" y="150" font-size="15" font-weight="600" letter-spacing="2.4" fill="#c4b5fd">OPEN SOURCE · MIT · .NET 10+</text>

    <text x="92" y="292" font-size="100" font-weight="800" letter-spacing="-2"><tspan fill="#ffffff">Dotnet</tspan><tspan fill="url(#brand)">Pilot</tspan></text>

    <text x="96" y="372" font-size="40" font-weight="600" fill="#e6edf3">AI coding agents that</text>
    <text x="96" y="422" font-size="40" font-weight="600" fill="#e6edf3">understand your .NET solution.</text>

    <text x="96" y="484" font-size="22" fill="#9ba3b4">Roslyn-backed checks for DI wiring, architecture</text>
    <text x="96" y="514" font-size="22" fill="#9ba3b4">boundaries and EF Core migrations.</text>

    <g font-size="19" font-weight="600">
      <rect x="96" y="560" width="176" height="46" rx="23" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="122" cy="583" r="6" fill="#d97757"/>
      <text x="138" y="590" fill="#e6edf3">Claude Code</text>
      <rect x="286" y="560" width="120" height="46" rx="23" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="312" cy="583" r="6" fill="#4ec9b0"/>
      <text x="328" y="590" fill="#e6edf3">Codex</text>
      <rect x="420" y="560" width="126" height="46" rx="23" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="446" cy="583" r="6" fill="#569cd6"/>
      <text x="462" y="590" fill="#e6edf3">Cursor</text>
    </g>

    <g>
      <text x="96" y="706" font-size="46" font-weight="800" fill="url(#brand)">16</text>
      <text x="96" y="736" font-size="17" fill="#9ba3b4">Roslyn tools</text>
      <text x="256" y="706" font-size="46" font-weight="800" fill="url(#brand)">9</text>
      <text x="256" y="736" font-size="17" fill="#9ba3b4">specialist agents</text>
      <text x="436" y="706" font-size="46" font-weight="800" fill="url(#brand)">15</text>
      <text x="436" y="736" font-size="17" fill="#9ba3b4">pattern skills</text>
      <text x="596" y="706" font-size="46" font-weight="800" fill="url(#brand)">16</text>
      <text x="596" y="736" font-size="17" fill="#9ba3b4">commands</text>
    </g>

    <text x="96" y="830" font-size="20" font-family="'Cascadia Code', Consolas, monospace" fill="#8b949e">github.com/zdanovichnick/dotnet-pilot</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="800" y="160" width="704" height="560" rx="16" fill="#0d1117"/>
  </g>
  <rect x="800.5" y="160.5" width="703" height="559" rx="16" fill="none" stroke="#30363d"/>
  <path d="M816 160.5 H1488 A15.5 15.5 0 0 1 1503.5 176 V206 H800.5 V176 A15.5 15.5 0 0 1 816 160.5 Z" fill="#161b22"/>
  <line x1="800.5" y1="206" x2="1503.5" y2="206" stroke="#30363d"/>
  <circle cx="828" cy="183" r="7" fill="#ff5f56"/>
  <circle cx="852" cy="183" r="7" fill="#ffbd2e"/>
  <circle cx="876" cy="183" r="7" fill="#27c93f"/>
  <text x="1152" y="189" text-anchor="middle" font-size="15" font-family="'Cascadia Code', Consolas, monospace" fill="#8b949e">Claude Code · Orders.slnx</text>

  <rect x="1290" y="140" width="190" height="40" rx="20" fill="url(#brand)"/>
  <text x="1385" y="166" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.6" font-family="'Segoe UI', 'Inter', Arial, sans-serif" fill="#0b0f1a">ROSLYN-BACKED</text>

  <g font-size="19" font-family="'Cascadia Code', Consolas, 'Liberation Mono', monospace">
    <text x="832" y="254"><tspan fill="#58a6ff">&gt; </tspan><tspan fill="#e6edf3">/dotnet-pilot:dotnet:health-check</tspan></text>

    <text x="832" y="310"><tspan fill="#3fb950">✓ </tspan><tspan fill="#8b949e">Build</tspan><tspan x="1014" fill="#e6edf3">6 projects, 0 warnings</tspan></text>
    <text x="832" y="348"><tspan fill="#3fb950">✓ </tspan><tspan fill="#8b949e">Tests</tspan><tspan x="1014" fill="#e6edf3">248 passed</tspan></text>
    <text x="832" y="386"><tspan fill="#3fb950">✓ </tspan><tspan fill="#8b949e">NuGet</tspan><tspan x="1014" fill="#e6edf3">0 vulnerable packages</tspan></text>
    <text x="832" y="424"><tspan fill="#3fb950">✓ </tspan><tspan fill="#8b949e">References</tspan><tspan x="1014" fill="#e6edf3">no circular refs</tspan></text>

    <text x="832" y="472"><tspan fill="#f85149">✗ </tspan><tspan fill="#8b949e">DI</tspan><tspan x="1014" fill="#e6edf3">IOrderRepository not registered</tspan></text>
    <text x="832" y="502"><tspan x="1014" fill="#6e7681">needed by OrderService.cs:14</tspan></text>
    <text x="832" y="548"><tspan fill="#f85149">✗ </tspan><tspan fill="#8b949e">Architecture</tspan><tspan x="1014" fill="#e6edf3">Domain → Infrastructure</tspan></text>
    <text x="832" y="578"><tspan x="1014" fill="#6e7681">Orders.Domain.csproj:12</tspan></text>
  </g>
  <line x1="832" y1="620" x2="1472" y2="620" stroke="#30363d"/>
  <text x="832" y="668" font-size="19" font-family="'Cascadia Code', Consolas, monospace"><tspan fill="#e6edf3">2 issues</tspan><tspan fill="#8b949e"> found before they reach runtime</tspan></text>
</svg>
