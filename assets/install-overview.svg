<svg viewBox="0 0 960 590" xmlns="http://www.w3.org/2000/svg" font-family="'Cascadia Code', 'Fira Code', 'Consolas', monospace">
  <title>Install DotnetPilot in Claude Code, Codex, or Cursor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#13151a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="960" height="590" rx="12" fill="url(#bg)"/>

  <text x="24" y="40" font-size="19" font-weight="bold" fill="#e5e7eb">Install DotnetPilot</text>
  <text x="936" y="40" text-anchor="end" font-size="12" fill="#6b7280">one Roslyn companion · three apps</text>

  <!-- Step 1: shared companion -->
  <rect x="20" y="60" width="920" height="68" rx="8" fill="#1e2128" stroke="#2a2d36"/>
  <text x="40" y="88" font-size="15" font-weight="bold" fill="#c586c0">1 · Every app</text>
  <text x="40" y="110" font-size="11" fill="#888">run in: terminal</text>
  <line x1="240" y1="74" x2="240" y2="114" stroke="#2a2d36"/>
  <text x="260" y="90" font-size="13"><tspan fill="#9cdcfe">dotnet tool install</tspan><tspan fill="#d4d4d4"> -g </tspan><tspan fill="#ce9178">DotnetPilot.Mcp.Roslyn</tspan></text>
  <text x="260" y="110" font-size="11" fill="#6a9955"># needs the .NET 10 SDK · restart your app after installing</text>

  <text x="24" y="154" font-size="12" fill="#6b7280">2 · Add the plugin to your app</text>

  <!-- Claude Code -->
  <rect x="20" y="164" width="920" height="124" rx="8" fill="#1e2128" stroke="#2a2d36"/>
  <rect x="20" y="164" width="4" height="124" rx="2" fill="#d97757"/>
  <text x="40" y="194" font-size="16" font-weight="bold" fill="#d97757">Claude Code</text>
  <text x="40" y="216" font-size="11" fill="#888">run in: Claude Code chat</text>
  <text x="40" y="234" font-size="11" fill="#888">needs: Node.js 18+</text>
  <line x1="240" y1="178" x2="240" y2="274" stroke="#2a2d36"/>
  <g font-size="12.5">
    <text x="260" y="192"><tspan fill="#9cdcfe">/plugin marketplace add</tspan><tspan fill="#ce9178"> zdanovichnick/dotnet-pilot</tspan></text>
    <text x="260" y="211"><tspan fill="#9cdcfe">/plugin install</tspan><tspan fill="#ce9178"> dotnet-pilot@dotnet-pilot-marketplace</tspan></text>
    <text x="260" y="230"><tspan fill="#9cdcfe">/reload-plugins</tspan></text>
    <text x="260" y="249" fill="#6a9955"># open your .NET solution directory</text>
    <text x="260" y="270" fill="#4ec9b0">✓  /dotnet-pilot:dotnet:health-check</text>
  </g>

  <!-- Codex -->
  <rect x="20" y="300" width="920" height="124" rx="8" fill="#1e2128" stroke="#2a2d36"/>
  <rect x="20" y="300" width="4" height="124" rx="2" fill="#4ec9b0"/>
  <text x="40" y="330" font-size="16" font-weight="bold" fill="#4ec9b0">Codex</text>
  <text x="40" y="352" font-size="11" fill="#888">run in: terminal</text>
  <text x="40" y="370" font-size="11" fill="#888">needs: Codex CLI, Git,</text>
  <text x="40" y="386" font-size="11" fill="#888">Node.js 18+</text>
  <line x1="240" y1="314" x2="240" y2="410" stroke="#2a2d36"/>
  <g font-size="12.5">
    <text x="260" y="328"><tspan fill="#9cdcfe">git clone</tspan><tspan fill="#ce9178"> https://github.com/zdanovichnick/dotnet-pilot.git</tspan><tspan fill="#d4d4d4"> &amp;&amp; </tspan><tspan fill="#9cdcfe">cd</tspan><tspan fill="#ce9178"> dotnet-pilot</tspan></text>
    <text x="260" y="347"><tspan fill="#9cdcfe">node</tspan><tspan fill="#ce9178"> scripts/build-host-plugins.js</tspan></text>
    <text x="260" y="366"><tspan fill="#9cdcfe">codex plugin marketplace add</tspan><tspan fill="#ce9178"> ./dist/plugins/codex</tspan></text>
    <text x="260" y="385"><tspan fill="#9cdcfe">codex plugin add</tspan><tspan fill="#ce9178"> dotnet-pilot@dotnet-pilot-marketplace</tspan></text>
    <text x="260" y="406" fill="#4ec9b0">✓  new chat in your solution directory → $dnp-dotnet-health-check</text>
  </g>

  <!-- Cursor -->
  <rect x="20" y="436" width="920" height="124" rx="8" fill="#1e2128" stroke="#2a2d36"/>
  <rect x="20" y="436" width="4" height="124" rx="2" fill="#569cd6"/>
  <text x="40" y="466" font-size="16" font-weight="bold" fill="#569cd6">Cursor</text>
  <text x="40" y="488" font-size="11" fill="#888">run in: terminal</text>
  <text x="40" y="506" font-size="11" fill="#888">needs: Git, Node.js 18+</text>
  <line x1="240" y1="450" x2="240" y2="546" stroke="#2a2d36"/>
  <g font-size="12.5">
    <text x="260" y="464"><tspan fill="#9cdcfe">git clone</tspan><tspan fill="#ce9178"> https://github.com/zdanovichnick/dotnet-pilot.git</tspan><tspan fill="#d4d4d4"> &amp;&amp; </tspan><tspan fill="#9cdcfe">cd</tspan><tspan fill="#ce9178"> dotnet-pilot</tspan></text>
    <text x="260" y="483"><tspan fill="#9cdcfe">node</tspan><tspan fill="#ce9178"> scripts/build-host-plugins.js</tspan></text>
    <text x="260" y="502"><tspan fill="#9cdcfe">cp -R</tspan><tspan fill="#ce9178"> dist/plugins/cursor/dotnet-pilot ~/.cursor/plugins/local/</tspan></text>
    <text x="260" y="521" fill="#6a9955"># Windows: use the PowerShell copy step · then restart Cursor</text>
    <text x="260" y="542" fill="#4ec9b0">✓  /dnp-dotnet-health-check</text>
  </g>

  <text x="480" y="580" text-anchor="middle" font-size="11" fill="#6b7280">Codex and Cursor: or download a prebuilt package from the plugin package builds</text>
</svg>
